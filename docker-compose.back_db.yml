services:
  postgres:
    image: postgres:16
    container_name: monitorium_postgres
    restart: always
    env_file:
      - .env
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    volumes:
      - monitorium-postgres-data:/var/lib/postgresql/data
      - monitorium-postgres-logs:/var/log/postgresql
    networks:
      - monitorium

  backend:
    container_name: monitorium_backend
    restart: always
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.app
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - '${API_PORT}:${API_PORT}'
    command: ["sh", "-c", "npx prisma migrate deploy --schema ./prisma/schema.prisma && node dist/main"]
    networks:
      - monitorium
      
networks:
  monitorium:
    driver: bridge

volumes:
  monitorium-postgres-data:
  monitorium-postgres-logs:
